<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SafeWalk</title>

  <!-- Leaflet: the library that draws the map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Supabase: the library that talks to our database and photo storage -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="panel">
    <h1>SafeWalk</h1>
    <p id="status">Click the map to set your start point (A).</p>
    <div id="routes"></div>
    <button id="reset">Reset</button>
    <button id="report-btn">Report incident</button>
    <div id="incident-count"></div>

    <!-- Report an issue: photo -> AI category -> place on map -->
    <div id="report">
      <h2>Report an issue</h2>
      <input type="file" id="photo" accept="image/*" />
      <img id="preview" hidden alt="Selected photo" />
      <p id="report-status"></p>
      <div id="report-form" hidden>
        <label>Category <select id="report-category"></select></label>
        <label>Severity <select id="report-severity"></select></label>
        <button id="place-report">Place on map</button>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <!-- The incident form. <dialog> is a built-in element that pops up above the page. -->
  <dialog id="report-dialog">
    <form id="report-form">
      <h2>Report an incident</h2>

      <label>Type
        <select id="report-type" required></select>
      </label>

      <label>Photo
        <input id="report-photo" type="file" accept="image/*" required />
      </label>
      <img id="photo-preview" alt="Photo preview" hidden />

      <label>Notes (optional)
        <textarea id="report-notes" rows="3" maxlength="500"></textarea>
      </label>

      <p id="report-error"></p>
      <div class="form-buttons">
        <button type="button" id="report-cancel">Cancel</button>
        <button type="submit">Save incident</button>
      </div>
    </form>
  </dialog>

  <!-- config.js must load BEFORE app.js, because app.js uses CONFIG -->
  <script src="config.js"></script>
  <script src="vision.js"></script>
  <script src="app.js"></script>
  <script src="incidents.js"></script>
</body>
</html>
