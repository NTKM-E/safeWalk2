<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SafeWalk</title>

  <!-- Leaflet: the library that draws the map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Supabase: the library that talks to our database and photo storage -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="panel">
    <h1>SafeWalk</h1>
    <p id="status">Click the map to set your start point (A).</p>
    <div id="routes"></div>
    <button id="reset">Reset</button>
    <button id="report-btn">Report incident</button>
    <div id="incident-count"></div>
  </div>

  <div id="map"></div>

  <!-- The incident form. <dialog> is a built-in element that pops up above the page. -->
  <dialog id="report-dialog">
    <form id="report-form">
      <h2>Report an incident</h2>

      <!-- Step 1: a live photo from the camera (location is automatic),
           or an uploaded photo (the user marks the location on the map). -->
      <div id="photo-source" class="form-buttons">
        <button type="button" id="take-photo">📷 Take photo</button>
        <button type="button" id="upload-photo">🖼️ Upload photo</button>
      </div>
      <input id="report-photo" type="file" accept="image/*" hidden />
      <div id="camera" hidden>
        <video id="camera-video" autoplay playsinline muted></video>
        <button type="button" id="snap">Snap photo</button>
      </div>
      <img id="photo-preview" alt="Photo preview" hidden />
      <p id="ai-suggestion"></p>

      <!-- Step 2: check the type (pre-filled by the AI) and add notes -->
      <label>Type
        <select id="report-type" required></select>
      </label>

      <label>Notes (optional)
        <textarea id="report-notes" rows="3" maxlength="500"></textarea>
      </label>

      <p id="report-location"></p>
      <p id="report-error"></p>
      <div class="form-buttons">
        <button type="button" id="report-cancel">Cancel</button>
        <button type="submit" id="report-save" disabled>Save incident</button>
      </div>
    </form>
  </dialog>

  <!-- Shown to other users when they walk near an incident -->
  <dialog id="verify-dialog">
    <h2>Is this hazard still here?</h2>
    <img id="verify-photo" alt="Reported hazard" />
    <p id="verify-text"></p>
    <div class="form-buttons">
      <button type="button" id="verify-unsure">Not sure</button>
      <button type="button" id="verify-no">No, it's gone</button>
      <button type="button" id="verify-yes">Yes, it's here</button>
    </div>
  </dialog>

  <!-- Order matters: config.js (CONFIG) and vision.js are used by the scripts after them -->
  <script src="config.js"></script>
  <script src="vision.js"></script>
  <script src="app.js"></script>
  <script src="incidents.js"></script>
</body>
</html>
