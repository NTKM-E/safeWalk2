<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SafeWalk</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ====================== Side panel ====================== -->
  <div id="panel">
    <h1>🛡 SafeWalk</h1>
    <p id="status">Click the map to set your start point (A).</p>

    <!-- ── Route Explorer / Dynamic Evaluation ── -->
    <div class="section-heading">
      <span class="eyebrow">ROUTE OPTIONS</span>
    </div>
    <div id="routes"></div>

    <div class="panel-buttons">
      <button id="reset">🔄 Reset</button>
      <button id="report-btn">📍 Report incident</button>
    </div>
    <div id="incident-count"></div>
  </div>

  <!-- ====================== Map ====================== -->
  <div id="map"></div>

  <!-- ====================== Report dialog ====================== -->
  <dialog id="report-dialog">
    <form id="report-form">
      <h2>Report an incident</h2>

      <!-- Step 1: choose how to add a photo -->
      <div id="photo-source" class="form-buttons">
        <button type="button" id="take-photo">📷 Take photo</button>
        <button type="button" id="upload-photo">🖼 Upload photo</button>
      </div>
      <input id="report-photo" type="file" accept="image/*" hidden />
      <div id="camera" hidden>
        <video id="camera-video" autoplay playsinline muted></video>
        <button type="button" id="snap">Snap photo</button>
      </div>
      <img id="photo-preview" alt="Photo preview" hidden />
      <p id="ai-suggestion"></p>

      <!-- Step 2: confirm type (pre-filled by AI) and add notes -->
      <label>Type
        <select id="report-type" required></select>
      </label>

      <label>Notes (optional)
        <textarea id="report-notes" rows="3" maxlength="500"></textarea>
      </label>

      <p id="report-location"></p>
      <p id="report-error"></p>
      <div class="form-buttons">
        <button type="button" id="report-cancel">Cancel</button>
        <button type="submit" id="report-save" disabled>Save incident</button>
      </div>
    </form>
  </dialog>

  <!-- ====================== Verify dialog ====================== -->
  <dialog id="verify-dialog">
    <h2>Is this hazard still here?</h2>
    <img id="verify-photo" alt="Reported hazard" />
    <p id="verify-text"></p>
    <div class="form-buttons">
      <button type="button" id="verify-unsure">Not sure</button>
      <button type="button" id="verify-no">No, it's gone</button>
      <button type="button" id="verify-yes">Yes, it's here</button>
    </div>
  </dialog>

  <!-- Load order matters: config → vision → app → incidents -->
  <script src="config.js"></script>
  <script src="vision.js"></script>
  <script src="app.js"></script>
  <script src="incidents.js"></script>
</body>
</html>
